<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Playground</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101724;color:#eff5ff;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}
#toolbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:2;pointer-events:none}button{pointer-events:auto;background:#26364e;color:white;border:1px solid #4e6280;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}button:hover,button.on{background:#4674aa}
#help{position:fixed;bottom:10px;left:10px;background:#0e1825db;border-radius:8px;padding:9px;pointer-events:none}#status{position:fixed;bottom:10px;right:10px;background:#0e1825db;padding:9px;border-radius:8px}#error{display:none;position:fixed;inset:0;background:#111722;place-items:center;padding:25px;text-align:center;z-index:9}
</style></head><body>
<div id="toolbar"><button data-spawn="ragdoll">+ Ragdoll</button><button data-spawn="box">+ Crate</button><button data-spawn="ball">+ Ball</button><button data-spawn="tower">+ Tower</button><button id="pause">Pause</button><button id="slow">Slow motion</button><button id="clear">Clear</button><button id="reset">Reset</button></div>
<canvas id="game"></canvas><div id="help">Drag with mouse or touch · 1–4 spawn · Space pause · Delete clear</div><div id="status">Loading…</div><div id="error">Matter.js failed to load. Check your internet connection and refresh.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function(){
'use strict';
if(!window.Matter){document.getElementById('error').style.display='grid';return;}
const M=Matter,{Engine,World,Bodies,Composite,Constraint,Mouse,MouseConstraint}=M;
const engine=Engine.create({enableSleeping:true});engine.gravity.y=1.3;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
let W=innerWidth,H=innerHeight,dpr=1,objects=[],walls=[],group=-1,paused=false,slow=false,last=performance.now(),acc=0;
const mouse=Mouse.create(canvas),drag=MouseConstraint.create(engine,{mouse,constraint:{stiffness:.18,damping:.15,render:{visible:false}}});
World.add(engine.world,drag);
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);mouse.pixelRatio=dpr;
 for(const wall of walls)World.remove(engine.world,wall);
 walls=[Bodies.rectangle(W/2,H+30,W*3,60,{isStatic:true}),Bodies.rectangle(-30,H/2,60,H*3,{isStatic:true}),Bodies.rectangle(W+30,H/2,60,H*3,{isStatic:true}),Bodies.rectangle(W/2,-70,W*3,60,{isStatic:true})];World.add(engine.world,walls);
}
addEventListener('resize',resize);
function add(x){World.add(engine.world,x);objects.push(x);return x;}
function rect(x,y,w,h,color='#b88558',opts={}){const b=Bodies.rectangle(x,y,w,h,{friction:.7,restitution:.13,density:.0018,...opts});b.paint=color;return add(b);}
function ball(x,y,r,color='#70bddd',opts={}){const b=Bodies.circle(x,y,r,{friction:.5,restitution:.65,density:.0018,...opts});b.paint=color;return add(b);}
function connect(a,b,pa,pb){add(Constraint.create({bodyA:a,bodyB:b,pointA:pa,pointB:pb,length:2,stiffness:.75,damping:.12}));}
function ragdoll(x,y){
 const g=--group,filter={group:g},skin='#e9bd97',shirt='#6eacda',pants='#5a6f98';
 const head=ball(x,y-58,13,skin,{restitution:.1,collisionFilter:filter}),chest=rect(x,y-12,25,54,shirt,{collisionFilter:filter}),hip=rect(x,y+23,24,18,pants,{collisionFilter:filter});
 const la=rect(x-24,y-12,13,33,skin,{collisionFilter:filter}),ra=rect(x+24,y-12,13,33,skin,{collisionFilter:filter}),lf=rect(x-27,y+20,11,30,skin,{collisionFilter:filter}),rf=rect(x+27,y+20,11,30,skin,{collisionFilter:filter});
 const lt=rect(x-10,y+56,14,39,pants,{collisionFilter:filter}),rt=rect(x+10,y+56,14,39,pants,{collisionFilter:filter}),ll=rect(x-10,y+92,12,36,pants,{collisionFilter:filter}),rl=rect(x+10,y+92,12,36,pants,{collisionFilter:filter});
 connect(head,chest,{x:0,y:12},{x:0,y:-27});connect(chest,hip,{x:0,y:26},{x:0,y:-9});
 connect(chest,la,{x:-13,y:-20},{x:0,y:-15});connect(chest,ra,{x:13,y:-20},{x:0,y:-15});connect(la,lf,{x:0,y:16},{x:0,y:-14});connect(ra,rf,{x:0,y:16},{x:0,y:-14});
 connect(hip,lt,{x:-8,y:7},{x:0,y:-19});connect(hip,rt,{x:8,y:7},{x:0,y:-19});connect(lt,ll,{x:0,y:19},{x:0,y:-17});connect(rt,rl,{x:0,y:19},{x:0,y:-17});
}
function spawn(type,x=W*.5,y=Math.max(160,H*.32)){
 if(type==='ragdoll')ragdoll(x,y);
 if(type==='box')rect(x,y,55,55);
 if(type==='ball')ball(x,y,26);
 if(type==='tower')for(let i=0;i<6;i++)for(let j=0;j<3;j++)rect(x+(j-1)*43,y-i*44,40,40,['#b88558','#b5a07a','#8397b3'][i%3]);
}
function clear(){drag.constraint.bodyB=null;drag.body=null;for(const o of objects)World.remove(engine.world,o);objects=[];}
function reset(){clear();spawn('ragdoll',W*.35,Math.max(180,H*.33));spawn('tower',W*.68,Math.max(280,H*.62));spawn('ball',W*.5,Math.max(170,H*.35));}
document.querySelectorAll('[data-spawn]').forEach(b=>b.onclick=()=>spawn(b.dataset.spawn));
const pb=document.getElementById('pause'),sb=document.getElementById('slow');
function pause(){paused=!paused;pb.textContent=paused?'Resume':'Pause';pb.classList.toggle('on',paused);}
pb.onclick=pause;sb.onclick=()=>{slow=!slow;sb.classList.toggle('on',slow);};document.getElementById('clear').onclick=clear;document.getElementById('reset').onclick=reset;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause();}const types={Digit1:'ragdoll',Digit2:'box',Digit3:'ball',Digit4:'tower'};if(types[e.code])spawn(types[e.code]);if(e.code==='Delete'||e.code==='Backspace')clear();});
function draw(){
 ctx.fillStyle='#151f2d';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#26354b';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
 ctx.fillStyle='#415b70';ctx.fillRect(0,H-8,W,8);
 for(const b of Composite.allBodies(engine.world)){if(b.isStatic)continue;ctx.beginPath();
 if(b.circleRadius)ctx.arc(b.position.x,b.position.y,b.circleRadius,0,Math.PI*2);
 else {b.vertices.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();}
 ctx.fillStyle=b.paint||'#9dabbd';ctx.fill();ctx.strokeStyle='#152236';ctx.lineWidth=2;ctx.stroke();}
 for(const c of Composite.allConstraints(engine.world)){if(!c.bodyA||!c.bodyB)continue;
 const a=M.Vector.add(c.bodyA.position,M.Vector.rotate(c.pointA,c.bodyA.angle)),b=M.Vector.add(c.bodyB.position,M.Vector.rotate(c.pointB,c.bodyB.angle));
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#e8d5ba';ctx.lineWidth=4;ctx.stroke();}
 status.textContent=(Composite.allBodies(engine.world).length-walls.length)+' bodies · '+(paused?'Paused':slow?'0.25× speed':'1× speed');
}
function frame(now){const dt=Math.min(now-last,50);last=now;if(!paused){acc+=dt*(slow?.25:1);let n=0;while(acc>=1000/60&&n++<4){Engine.update(engine,1000/60);acc-=1000/60;}}draw();requestAnimationFrame(frame);}
resize();reset();requestAnimationFrame(frame);
})();
</script></body></html>
